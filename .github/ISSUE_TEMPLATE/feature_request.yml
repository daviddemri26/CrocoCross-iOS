name: Feature request
description: Suggest an improvement to CrocoCross.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this improve?
      description: Describe the player or developer need.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Explain your idea and any alternatives you considered.
    validations:
      required: true
