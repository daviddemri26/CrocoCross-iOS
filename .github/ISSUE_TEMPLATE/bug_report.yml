name: Bug report
description: Report a reproducible gameplay, interface or build problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include mode, rider, world and weekly date when relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and build
      placeholder: iPhone model / iOS version / app build or commit; simulator or physical device
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove account identifiers, credentials and other personal information.
