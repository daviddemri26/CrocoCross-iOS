name: iOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Core tests and simulator build
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- CrocoCross.xcodeproj
      - name: Validate App Store package
        run: python3 scripts/check-app-store-package.py
      - name: Test game rules and physics
        run: swift test --disable-sandbox
      - name: Test local persistence
        run: |
          xcrun swiftc -swift-version 6 App/Services/LocalStore.swift scripts/check-local-store.swift -o "$RUNNER_TEMP/crococross-store-check"
          "$RUNNER_TEMP/crococross-store-check"
      - name: Test audio preferences and playlist
        run: |
          xcrun swiftc -swift-version 6 -module-cache-path "$RUNNER_TEMP/crococross-audio-module-cache" App/Services/AudioService.swift scripts/check-audio-settings.swift -o "$RUNNER_TEMP/crococross-audio-check"
          "$RUNNER_TEMP/crococross-audio-check"
      - name: Test competition version isolation
        run: |
          xcrun swiftc -swift-version 6 App/Services/CompetitionRules.swift App/Services/LocalStore.swift scripts/check-competition-versioning.swift -o "$RUNNER_TEMP/crococross-competition-check"
          "$RUNNER_TEMP/crococross-competition-check"
      - name: Test continuous panorama coverage
        run: |
          xcrun swiftc App/Scene/BackgroundPanorama.swift scripts/check-panorama.swift -o "$RUNNER_TEMP/crococross-panorama-check"
          "$RUNNER_TEMP/crococross-panorama-check"
      - name: Validate articulated Rocco assets
        run: |
          xcrun swiftc -swift-version 6 scripts/check-rocco-assets.swift -o "$RUNNER_TEMP/crococross-rocco-check"
          "$RUNNER_TEMP/crococross-rocco-check"
      - name: Build iOS simulator app
        run: |
          xcodebuild -project CrocoCross.xcodeproj -scheme CrocoCross \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/crococross-derived" \
            CODE_SIGNING_ALLOWED=NO build
